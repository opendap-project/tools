schema = "opendap.requirements/v1"

[[block]]
markdown = "# Tools requirements\n\nRequirements TK-001, TK-009, TK-010 and TK-011 in [cli](https://github.com/opendap-project/host/blob/main/cli/docs/requirements/README.md) apply to every folder of this root.\n\nThe requirements of the former toolkit repositories, gathered here (HL-71). Their TK IDs are legacy: never renumbered and never extended; new TK requirements are the host CLI's.\n"

[[block]]
markdown = "## Hardware (electronics, mechanical, parts, sim)\n"

[[block]]
[[block.requirement]]
id = "TK-014"
text = "Product-side 3D animations and interactive previews that do not need Blender may be standalone HTML documents using libraries such as three.js or anime.js."
priority = "should"
status = "confirmed"
[[block.requirement]]
id = "TK-015"
text = "Product presentation videos may be produced from the standalone HTML previews: captured frame by frame with Playwright and assembled with ffmpeg."
priority = "should"
status = "confirmed"

[[block]]
markdown = "\n- Video capture must be deterministic: the page's clock is stepped frame by frame (three.js clock, anime.js `seek`, a controlled `requestAnimationFrame`) instead of recording in real time, so every frame is exact regardless of host speed.\n"

[[block]]
markdown = "## Verification (measure)\n"

[[block]]
[[block.requirement]]
id = "TK-012"
text = "Verification shall rely on simulations and on samples captured from sessions, on the virtual T1 now and on physical prototypes later. Dedicated lab instruments are not assumed."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "TK-013"
text = "The verification method in [`workspace/docs/specs/verification.md`](../../workspace/docs/specs/verification.md) is approved, without lab instruments."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "TK-016"
text = "Every release shall pass scale tests on the virtual T1 and on hardware: synthetic libraries well beyond the largest real ones (for example 500,000 tracks), long playlists and large files, with browse, search, scan and start-up times measured against fixed budgets."
priority = "must"
status = "confirmed"
[[block.requirement]]
id = "TK-017"
text = "Every release shall pass endurance tests: days of continuous playback and UI use without a restart, tracking memory, file descriptors, CPU and response times, failing on any upward trend."
priority = "must"
status = "confirmed"

[[block]]
markdown = "\n- TK-012, TK-013 — audio without instruments: bit-perfect is a property of the digital stream, so it is verified by comparing captured bits. (1) Virtual T1: `snd-aloop` capture of the playback engine output, with negative controls. (2) Prototype: a passive tap of the I2S/DSD lines at test pads, captured by the board's RP2350 (PIO) and streamed to the host; a passive listener is not in the data path. (3) Analog output: recordings with a consumer USB audio interface, or with the recorder HAT's ADC, for relative measurements and regressions, not calibrated figures.\n"

[[block]]
markdown = "## Image and host setup\n\nNo requirements of their own yet. Context for image: [RFC 0008](https://github.com/opendap-project/rfcs/blob/main/text/0008-repository-restructure.md), which moved those tools here from blackbird-os `build/` and system `scripts/`.\n"
