[package]
name = "odw-dispatch"
description = "Umbrella-command dispatch of the command standard: tools.toml discovery, help, --json and exit codes; the odw binary"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/opendap-project/toolkit-host"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "odw"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
