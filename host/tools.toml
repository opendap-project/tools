# The tools this root adds to the maintainers' umbrella command (command standard §3).
schema = "opendap.tools/v1"
front = "odw"

[[tool]]
name = "audit"
summary = "Workspace metrics from every repository's tracked files: dated snapshots and conformance"
entry = "bin/odw-audit"
replaces = "odapkit-audit"
audience = "maintainer"
stability = "preview"
probe = ["--workspace", "{workspace}", "--json"]

[[tool]]
name = "docs"
summary = "Docs gates, the generated docs index and RFC application status"
entry = "bin/odw-docs"
replaces = "odapkit-docs"
audience = "maintainer"
stability = "preview"
probe = ["check", "--json", "{root}/README.md"]

[[tool]]
name = "noindex"
summary = "Keep generated trees (target/, .venv/, test caches) out of the macOS Spotlight index"
entry = "bin/odw-noindex"
replaces = "odapkit-noindex"
audience = "maintainer"
stability = "preview"
probe = ["--dry-run", "--json", "{root}"]

[[tool]]
name = "plan"
summary = "A maintainers' programme as data: list, claim and record its tasks, check it, render its index"
entry = "bin/odw-plan"
replaces = "odapkit-plan"
audience = "maintainer"
stability = "preview"
probe = ["--programme", "{root}/tests/fixtures/programme", "--json", "list"]

[[tool]]
name = "qemu"
summary = "QEMU for virtual OpenDAP devices, with the patches OpenDAP carries"
entry = "bin/odw-qemu"
replaces = "odapkit-qemu"
audience = "maintainer"
stability = "preview"

[[tool]]
name = "rename"
summary = "One root's cut from the rename map: merge, plan, apply and check"
entry = "bin/odw-rename"
replaces = "odapkit-rename"
audience = "maintainer"
stability = "preview"
probe = ["plan", "no-such-root", "--workspace", "{workspace}", "--map", "/dev/null", "--json"]

[[tool]]
name = "req"
summary = "Requirements as data: import, render and check them, index every repository"
entry = "bin/odw-req"
replaces = "odapkit-req"
audience = "maintainer"
stability = "preview"
probe = ["index", "--workspace", "{workspace}", "--json"]

[[tool]]
name = "sync"
summary = "Shared boilerplate from the workspace templates: report drift or repair it"
entry = "bin/odw-sync"
replaces = "odapkit-sync"
audience = "maintainer"
stability = "preview"
probe = ["--workspace", "{workspace}", "--check", "--json"]

[[tool]]
name = "verify"
summary = "Verification matrices as data: render, collect results by variant, uncovered requirements"
entry = "bin/odw-verify"
replaces = "odapkit-verify"
audience = "maintainer"
stability = "preview"
probe = ["coverage", "{root}/tests/fixtures/verification/matrix.toml", "--workspace", "{workspace}", "--json"]

[[tool]]
name = "vmnet"
summary = "Give virtual OpenDAP devices a NIC on this Mac's network"
entry = "bin/odw-vmnet"
replaces = "odapkit-vmnet"
audience = "maintainer"
stability = "preview"
