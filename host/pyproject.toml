[project]
name = "odw"
version = "0.1.0"
description = "The OpenDAP maintainers' workspace tools: schemas, programme plan, audit."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odw"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "odw/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: builds the package"]
