# The tools this folder adds to the maintainers' umbrella command (command standard §3).
schema = "opendap.tools/v1"
front = "odw"

[[tool]]
name = "cli"
summary = "Inventory every command-line surface and check it against the command standard"
entry = "bin/odw-cli"
replaces = "odapkit-cli"
audience = "maintainer"
stability = "preview"
probe = ["list", "--workspace", "{workspace}", "--root", "public/tools", "--json"]

[[tool]]
name = "component"
summary = "Validate a component's export/component.yaml against the component export contract"
entry = "bin/odw-component"
replaces = "odapkit-component"
audience = "maintainer"
stability = "preview"
probe = ["validate", "--json", "{root}/component/tests/fixtures/board"]

[[tool]]
name = "render"
summary = "Generate and check a component's committed visual outputs: schematics, layer plots, 3D renders"
entry = "bin/odw-render"
replaces = "odapkit-render"
audience = "maintainer"
stability = "preview"
probe = ["check", "--json", "{root}/render/tests/fixtures/no-components"]
