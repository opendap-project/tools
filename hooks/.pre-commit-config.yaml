# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  # This repository provides the shared hooks, so it runs them from its own tree.
  - repo: local
    hooks:
      - id: no-stray-files
        name: No stray files
        entry: hooks/no-stray-files.sh
        language: script
        files: \.(pdf|html?)$
      - id: hooks-tests
        name: hook and tool tests (python3 -m unittest discover tests)
        entry: python3 -m unittest discover tests
        language: system
        pass_filenames: false
        files: ^(bin|hooks|lib|tests)/|^tools\.toml$|^\.pre-commit-hooks\.yaml$
