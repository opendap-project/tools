version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Schemas others build on: MPL-2.0.
[[annotations]]
path = "schemas/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "MPL-2.0"

# The craft rules: the craft standard's rule tables as data (kicad-lib docs, CC-BY-SA-4.0).
[[annotations]]
path = "craft/rules.toml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Schematic craft-check fixtures: copied from kicad-lib's examples/load-switch and its drawing
# sheet (CERN-OHL-W-2.0), and derived from them by make_fixture.py.
[[annotations]]
path = ["schematic/craft/tests/fixtures/good/**", "schematic/craft/tests/fixtures/bad/**", "schematic/craft/tests/fixtures/drawing-sheets/**", "schematic/craft/tests/fixtures/bad.kicad_sym"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CERN-OHL-W-2.0"
