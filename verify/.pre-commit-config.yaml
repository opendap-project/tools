# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/opendap-project/toolkit-hooks
    rev: v0.4.1
    hooks:
      - id: no-stray-files
  # The requirements README is rendered from requirements.toml and checked.
  - repo: local
    hooks:
      - id: requirements-current
        name: requirements README rendered (odapkit req render --check)
        entry: odapkit req render docs/requirements/requirements.toml --check
        language: system
        pass_filenames: false
        files: ^docs/requirements/
  # odapkit motion's command-line contract (command standard §6), without a screen or a recording.
  - repo: local
    hooks:
      - id: cli-contract
        name: command-line contract (tests/cli.sh)
        entry: tests/cli.sh
        language: system
        pass_filenames: false
        files: ^(bin|tools|tests)/|^tools\.toml$
      - id: motion-tests
        name: odapkit motion engine tests (tests/test_motion.py; a synthetic recording through ffmpeg)
        entry: python3 -m unittest discover tests
        language: system
        pass_filenames: false
        files: ^(bin|tools|tests)/|^tools\.toml$
