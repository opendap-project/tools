[workspace]
resolver = "3"
members = ["crates/odap-inject"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

# What toolkit-image odw-deploy puts on a running device by default (test instrumentation, in
# the development extension only).
[workspace.metadata.odap]
deploy = ["odap-inject"]
restart = []
