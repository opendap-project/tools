# The tools root's Python project (HL-71): the odw package, its schemas and tools.toml, and every domain's
# pytest suite, whose conftest.py at this root keeps the GIT_* protection (HL-64) for all of them.
[project]
name = "odw"
version = "0.1.0"
description = "The OpenDAP maintainers' workspace tools: schemas, programme plan, audit."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# One odw package from the domain folders (HL-71): each folder's odw/ joins the package (core/odw/__init__.py).
[tool.hatch.build.targets.wheel]
only-include = ["core/odw", "documentation/odw", "env/odw", "workspace/odw", "schemas"]
exclude = ["schemas/tests", "schemas/*.md", "schemas/REUSE.toml"]
sources = {"core" = "", "documentation" = "", "env" = "", "workspace" = "", "schemas" = "odw/schemas"}
dev-mode-dirs = ["core", "documentation", "env", "workspace"]

[tool.hatch.build.targets.wheel.force-include]
"core/tools.toml" = "odw/tools/core.toml"
"documentation/tools.toml" = "odw/tools/documentation.toml"
"env/tools.toml" = "odw/tools/env.toml"
"workspace/tools.toml" = "odw/tools/workspace.toml"

[tool.pytest.ini_options]
testpaths = ["core/tests", "core/component/tests", "documentation/tests", "env/tests", "schemas/tests", "workspace/tests"]
pythonpath = ["core/tests"]  # clifixtures, the helpers several domains' tests share
markers = ["slow: builds the package"]
