# The tools root's Python project (HL-71): the odw package, its schemas and tools.toml, and every domain's
# pytest suite, whose conftest.py at this root keeps the GIT_* protection (HL-64) for all of them.
[project]
name = "odw"
version = "0.1.0"
description = "The OpenDAP maintainers' workspace tools: schemas, programme plan, audit."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/src/odw"]

[tool.hatch.build.targets.wheel.force-include]
"host/schemas" = "odw/schemas"
"host/tools.toml" = "odw/tools.toml"

[tool.pytest.ini_options]
testpaths = ["host/tests"]
markers = ["slow: builds the package"]
