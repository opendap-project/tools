# The tools this root adds to the maintainers' umbrella command (command standard §3).
schema = "opendap.tools/v1"
front = "odw"

[[tool]]
name = "render"
summary = "Generate and check a component's committed visual outputs: schematics, layer plots, 3D renders"
entry = "bin/odw-render"
replaces = "odapkit-render"
audience = "maintainer"
stability = "preview"
probe = ["check", "--json", "{root}/tests/fixtures/render/no-components"]
