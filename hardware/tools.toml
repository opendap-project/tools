# The tools this root adds to the maintainers' umbrella command (command standard §3).
schema = "opendap.tools/v1"
front = "odw"

[[tool]]
name = "component"
summary = "Validate a component's export/component.yaml against the component export contract"
entry = "bin/odw-component"
replaces = "odapkit-component"
audience = "maintainer"
stability = "preview"
probe = ["validate", "--json", "{root}/tests/fixtures/component/board"]

[[tool]]
name = "craft"
summary = "Check a KiCad board, schematic or symbol library against the OpenDAP craft standard, by level"
entry = "bin/odw-craft"
replaces = "odapkit-craft"
audience = "maintainer"
stability = "preview"
# Each call names the script it runs, which the conformance test verifies through it (HL-105).
probe = [
  { call = ["check", "--json", "{root}/tests/fixtures/craft-sch/bad.kicad_sym"], reaches = "tools/sch-craft-check.py" },
  { call = ["rules", "render", "{root}/tests/fixtures/craft-rules/pcb-craft-standard.md", "--check", "--json"], reaches = "tools/craft/craftrules.py" },
]

[[tool]]
name = "parts"
summary = "Sourcing evaluation matrix: stock, price breaks and lifecycle per part and channel, scored"
entry = "bin/odw-parts"
replaces = "odapkit-parts"
audience = "maintainer"
stability = "preview"

[[tool]]
name = "variant"
summary = "Board variants (RFC 0011): validate, diff, BOM and per-variant schematic and PCB builds"
entry = "bin/odw-variant"
replaces = "odapkit-variant"
audience = "maintainer"
stability = "preview"
probe = ["get", "--dir", "{root}/tests/fixtures/variant/board/variants", "--json", "variant-b"]

[[tool]]
name = "sim"
summary = "Run a board's simulation regression checks (ngspice) against limits from its constraints and ADRs"
entry = "bin/odw-sim"
replaces = "odapkit-sim"
audience = "maintainer"
stability = "preview"
probe = ["list", "--json", "{root}/tests/fixtures/sim"]

[[tool]]
name = "stackup"
summary = "Layer stack and impedance-controlled trace geometry of a PCB: a 2D quasi-static field solver"
entry = "bin/odw-stackup"
replaces = "odapkit-stackup"
audience = "maintainer"
stability = "preview"
probe = [{ call = ["stack", "{root}/tests/fixtures/stackup/fixture.toml", "--json"], reaches = "tools/stackup/stackup.py" }]
