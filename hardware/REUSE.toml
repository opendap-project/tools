version = 1

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "**/*.md"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "docs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Schemas others build on: MPL-2.0.
[[annotations]]
path = "schemas/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "MPL-2.0"

# The craft rules: the craft standard's rule tables as data (kicad-lib docs, CC-BY-SA-4.0).
[[annotations]]
path = "tools/craft/rules.toml"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Schematic craft-check fixtures: copied from kicad-lib's examples/load-switch and its drawing
# sheet (CERN-OHL-W-2.0), and derived from them by make_fixture.py; the render fixture's schematic is a copy.
[[annotations]]
path = ["tests/fixtures/craft-sch/good/**", "tests/fixtures/craft-sch/bad/**", "tests/fixtures/craft-sch/drawing-sheets/**", "tests/fixtures/craft-sch/bad.kicad_sym", "tests/fixtures/render/component/hardware/demo/*.kicad_sch", "tests/fixtures/render/component/hardware/demo/load-switch.kicad_pro", "tests/fixtures/render/component/hardware/demo/sym-lib-table", "tests/fixtures/render/component/hardware/demo/example.kicad_sym", "tests/fixtures/render/component/hardware/drawing-sheets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The OpenDAP Project"
SPDX-License-Identifier = "CERN-OHL-W-2.0"
