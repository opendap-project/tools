# The OpenDAP PCB craft rules, one entry per rule, in the order of the standard.
# The tables of the craft standard (kicad-lib docs/specs/pcb-craft-standard.md) are rendered from
# this file with `odapkit craft rules render`, and the craft checks read their limits from it.
# Every field is the standard's own text; `limits` holds the values a check or a generator reads,
# each one stated in the rule's row. Schema: schemas/craft-rules.schema.json.
schema = "opendap.craft-rules/v1"
spec = "https://github.com/opendap-project/kicad-lib/blob/main/docs/specs/pcb-craft-standard.md"
levels = ["Q0", "Q1", "Q2", "Q3", "Q4"]

[[rule]]
id = "CRAFT-01"
section = "3"
level = "Q2"
rule = "One typeface: KiCad's stroke font, regular, upright. Logos and the brand wordmark are graphics, never text."
value = "`KiCad Font`, not bold, not italic"
why = "A stroke font plots as lines of one width, which the fab reproduces evenly; KLC sizes are given in it; SparkFun requires a vector font for the same reason"
source = "[KLC] F5.1; [SFE]"
enforcement = "DRC"

[[rule]]
id = "CRAFT-02"
section = "3"
level = "Q2"
rule = "Text height and stroke from a closed set; width equals height."
value = "0.8 × 0.15 mm (dense areas only); **1.0 × 0.15 mm** (reference designators); 1.6 × 0.24 mm (labels); 2.0 × 0.30 mm (board name)"
why = "Fewer sizes read as one hierarchy. 1.0 × 0.15 is KLC's reference size; 0.8 mm and 0.15 mm are the prototype fab's minimums, and it gives about 1 : 5 stroke to height as the best ratio; the larger sizes keep 15 % (SparkFun's ratio)"
source = "[KLC] F5.1; [FAB]; [JLC]; [SFE]"
enforcement = "DRC"
[rule.limits]
text_set_mm = [[0.8, 0.15], [1.0, 0.15], [1.6, 0.24], [2.0, 0.30]]

[[rule]]
id = "CRAFT-03"
section = "3"
level = "Q2"
rule = "Two reading directions: from the bottom edge (0°) and from the right edge (90°). A flipped footprint keeps its text angle, so the same two values hold on the bottom side."
value = "0° or 90°"
why = "A board read from two sides only, never upside down. No primary source was found for the two-direction convention: OpenDAP's choice"
source = "—"
enforcement = "DRC"

[[rule]]
id = "CRAFT-04"
section = "3"
level = "Q1"
rule = "Text reads from its own side: unmirrored on top, mirrored on the bottom."
value = "—"
why = "A reversed legend is not legible; KiCad also flags mirrored text on the front"
source = "[KICAD-DRC]"
enforcement = "DRC"

[[rule]]
id = "CRAFT-05"
section = "3"
level = "Q2"
rule = "One silk stroke for outlines and marks. Filled marks (pin-1 triangles, dots, the brand mark) have no stroke."
value = "0.15 mm"
why = "KLC allows 0.10–0.15 mm (0.12 nominal); the prototype fab's minimum line is 0.15 mm, so OpenDAP uses KLC's upper value"
source = "[KLC] F5.1; [FAB]"
enforcement = "DRC"
[rule.limits]
silk_stroke_mm = 0.15

[[rule]]
id = "CRAFT-06"
section = "3"
level = "Q1"
rule = "No silk inside a solder-mask opening (pads, exposed copper). Set the Board Setup check `silk_over_copper` to error."
value = "—"
why = "Silk on a pad prevents soldering; fabs clip it"
source = "[KLC] F5.1; [EC-LEG]; [JLC]"
enforcement = "DRC (Board Setup)"

[[rule]]
id = "CRAFT-07"
section = "3"
level = "Q2"
rule = "Silk clear of pads and via lands."
value = "0.15 mm from pads; 0.15 mm from via lands (DRC: 0.30 mm from the via hole, see the rule set's README)"
why = "JLCPCB's minimum to pads is 0.15 mm; KLC recommends 0.2 mm"
source = "[JLC]; [KLC] F5.1"
enforcement = "DRC"
[rule.limits]
silk_to_pad_mm = 0.15

[[rule]]
id = "CRAFT-08"
section = "3"
level = "Q2"
rule = "Silk clear of the board edge."
value = "0.5 mm"
why = "KLC's value; Eurocircuits clips legend within 0.25 mm of a routed edge"
source = "[KLC] F5.1; [EC-LEG]"
enforcement = "CHK (KiCad 10.0.7's DRC does not measure this reliably)"
[rule.limits]
silk_to_edge_mm = 0.5

[[rule]]
id = "CRAFT-09"
section = "3"
level = "Q2"
rule = "Text clear of any other silk, so every character stands alone."
value = "0.15 mm"
why = "Legibility; one stroke width of air"
source = "—"
enforcement = "DRC"

[[rule]]
id = "CRAFT-10"
section = "3"
level = "Q2"
rule = "Every part with electrical pads has a visible reference designator on the silk of its side. Where density forbids it, the designator moves to the fabrication layer and the part takes a `Craft_Exempt` with the reason."
value = "—"
why = "The open board is a repair document; see [§10](#10-decisions-taken) for why OpenDAP does not minimise its legend"
source = "MNT Reform [MNT]; [SFE]"
enforcement = "CHK"

[[rule]]
id = "CRAFT-11"
section = "3"
level = "Q2"
rule = "Every part carries `${REFERENCE}` on its fabrication layer."
value = "—"
why = "The assembly drawing, which is published, then names every part even where the silk cannot"
source = "[KLC] F5.2"
enforcement = "CHK"

[[rule]]
id = "CRAFT-12"
section = "3"
level = "Q3"
rule = "Reference designators in one size per side, beside their part (within 2 mm of its courtyard and nearer to it than to any other part), never under an SMD body."
value = "2 mm"
why = "One size reads as one system; a designator nearer another part names the wrong one; KLC forbids silk under SMD bodies"
source = "[KLC] F5.1"
enforcement = "CHK"
[rule.limits]
reference_to_courtyard_max_mm = 2.0

[[rule]]
id = "CRAFT-13"
section = "3"
level = "Q1"
rule = "Every polarised part (ICs, diodes, LEDs, transistors, connectors, batteries, crystals) has a pin-1 or polarity mark next to pin 1, outside the body, visible after assembly and after mating. Forms: a filled triangle for ICs and connectors, a bar at the cathode for diodes, `+` for polarised capacitors."
value = "—"
why = "Orientation errors are found at a glance; KLC's mark forms"
source = "[KLC] F5.1"
enforcement = "CHK (mark next to pin 1); Review (form)"

[[rule]]
id = "CRAFT-14"
section = "3"
level = "Q1"
rule = "Battery and power-input connectors are marked `+` and `−` in silk, within 3 mm."
value = "3 mm"
why = "The battery is user-replaceable (T1-055): its polarity must read without a schematic"
source = "T1-055"
enforcement = "CHK"

[[rule]]
id = "CRAFT-15"
section = "3"
level = "Q1"
rule = "Footprints follow KLC orientation and anchors: pin 1 top left (IPC-7351 \"Level A\"), two-terminal parts with pin 1 on the left; SMD anchor at the body centroid, THT anchor at pin 1. The fab package states the convention, as fabs differ (Eurocircuits uses IEC 61188-7, pin 1 bottom left)."
value = "—"
why = "Pick-and-place rotations come out right without per-part fixes"
source = "[KLC] F4.2, F6.2, F7.2; [EC-ROT]"
enforcement = "Review (library)"

[[rule]]
id = "CRAFT-20"
section = "4"
level = "Q1"
rule = "Board name and revision on the silk, from the title block (`${TITLE}`, `${REVISION}`), so the copper and the files cannot disagree."
value = "—"
why = "Revision mix-ups are the commonest bring-up error; the MNT Reform motherboard carries both"
source = "[MNT]"
enforcement = "CHK"

[[rule]]
id = "CRAFT-21"
section = "4"
level = "Q2"
rule = "Issue date (`${ISSUE_DATE}`, ISO 8601), the copyright holder \"The OpenDAP Project\", and the licence's SPDX identifier on the silk: `CERN-OHL-S-2.0` for product hardware, `CERN-OHL-W-2.0` for HAT reference designs and building blocks."
value = "—"
why = "The board carries its own terms; the MNT Reform motherboard prints a dated identification line"
source = "[MNT]; workspace licensing rule"
enforcement = "CHK"
[rule.limits]
holder = "The OpenDAP Project"
licences = ["CERN-OHL-S-2.0", "CERN-OHL-W-2.0"]

[[rule]]
id = "CRAFT-22"
section = "4"
level = "Q3"
rule = "The source location (`github.com/opendap-project/<repository>`) on the silk, and the OpenDAP mark as a footprint built from the approved files (mark ≥ 5 mm high, wordmark ≥ 4 mm, the print minimums; the mark's gap, 6.9 % of its height, stays above the silk's 0.15 mm line)."
value = "5 mm / 4 mm"
why = "CERN-OHL-S §4 requires recipients to be told the source location, and lets a notice require it on the product; OpenDAP puts it on the board. The mark's minimums are the brand's"
source = "[CERN-S] §1.9, §4; [BRAND]"
enforcement = "CHK (text, `OpenDAP_Mark*` footprint); Review (size)"

[[rule]]
id = "CRAFT-23"
section = "4"
level = "Q1"
rule = "The OSHW mark only after OSHWA certifies the board, with its UID next to it. No OpenDAP board is certified today, so no board carries it (**UNVERIFIED** whether certification will be sought)."
value = "UID: two letters and up to six digits"
why = "OSHWA allows the mark only after certification"
source = "[OSHWA]"
enforcement = "CHK"

[[rule]]
id = "CRAFT-24"
section = "4"
level = "Q2"
rule = "Title block complete: title, revision, ISO 8601 date, company \"The OpenDAP Project\"."
value = "—"
