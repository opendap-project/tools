[[rule]]
id = "CRAFT-103"
section = "9.1"
level = "Q2"
rule = "No hand-set colours on items: colour comes from the theme. Plots and reviews use the OpenDAP theme: graphite ink on white for parts, local labels and the sheet; functional accents, one per drawing role, for what a reader must tell apart at a glance: wires and junctions `#2563A8`, buses `#173866` (the same hue, darker, on the wider bus line), hierarchical labels and sheet pins `#007068` (a block's interface, one colour on both sides of the sheet boundary), global labels `#962668` (rails only, CRAFT-150), DNP and excluded-from-simulation markers `#6C40B8`; secondary text (fields, pin numbers, notes, net-class flags) in `graphite.700`, no-connect flags in `graphite.500`; the error and warning hues only for ERC markers, darkened for white (`#C62832`, `#966200`); the orange accent only for the editor's hover and selection. Every ink colour reaches 4.5:1 on white for text and 3:1 for lines, and the functional groups are at least ΔE76 20 apart (`colour-themes/check_theme.py`). Meaning is never carried by colour alone: label kinds keep their shapes (CRAFT-151), rails their power symbols (CRAFT-85)."
value = "[`colour-themes/opendap.json`](../../colour-themes/opendap.json)"
why = "Restrained palette with functional colour accents, orange reserved for interaction [DS] §1, §3; a monochrome theme made wires, labels, symbol bodies and rails hard to tell apart in the 2026-10-25 visual review (§12); prints in black and white without loss of meaning"
