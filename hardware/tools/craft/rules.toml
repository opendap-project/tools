level = "Q2"
rule = "Mirrored channels are laid out as mirrors: left and right audio channels, and the two halves of a DAC or amplifier, symmetric about an axis (or translated copies), part for part, with the same footprints and mirrored rotations. Declared in `<project>.craft.toml`."
