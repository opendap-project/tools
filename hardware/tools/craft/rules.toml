rule = "Component values always carry their unit: the number, one space, the SI prefix and the unit symbol. Unicode `Ω` (U+03A9) and `µ` (U+00B5), never `R`, `u`, the ohm sign U+2126 or the Greek mu U+03BC; the decimal point is `.`; no bare numbers, no `4k7` notation. Checked on resistors (`Ω`), capacitors (`F`), inductors (`H`) and crystals (`Hz`); any other part whose Value is a quantity follows the same form. Ratings go to Spec, never into Value."
