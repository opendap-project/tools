# Local checks for every commit. Install once per clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=5120"]
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/opendap-project/toolkit-hooks
    rev: v0.4.1
    hooks:
      - id: no-stray-files
  # The requirements README is rendered from requirements.toml and checked.
  - repo: local
    hooks:
      - id: requirements-current
        name: requirements README rendered (odapkit req render --check)
        entry: odapkit req render docs/requirements/requirements.toml --check
        language: system
        pass_filenames: false
        files: ^docs/requirements/
      # The craft standard's rule tables are rendered from tools/craft/rules.toml; the fixture copy
      # of the standard must stay current with it, and the checks must agree with the data.
      - id: craft-rules-current
        name: craft rule tables rendered (odapkit craft rules render --check)
        entry: bin/odapkit-craft rules render tests/fixtures/craft-rules/pcb-craft-standard.md --check
        language: system
        pass_filenames: false
        files: ^(tools/craft/|tests/fixtures/craft-rules/|bin/odapkit-craft$)
      - id: craft-rules-tests
        name: craft rules data, golden and drift tests
        entry: python3 -m unittest tests.test_craft_rules
        language: system
        pass_filenames: false
        files: ^(tools/craft/|tools/(pcb|sch)-craft-check\.py$|tests/test_craft_rules\.py$|tests/fixtures/craft-rules/|schemas/craft-rules\.schema\.json$)
  # Every tool's command-line contract, without KiCad, ngspice or the network.
  - repo: local
    hooks:
      - id: cli-contract
        name: command-line contract (tests/test_cli_contract.py)
        entry: python3 -m unittest tests.test_cli_contract
        language: system
        pass_filenames: false
        files: ^(bin|lib|tools|tests)/|^tools\.toml$
