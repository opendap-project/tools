# The image build VM (odw-image): Debian 13 (trixie) arm64, the distribution Blackbird OS is built
# from, running mkosi. odw-image fills __WORKSPACE__ and __DATA__ when it creates the VM.
minimumLimaVersion: 2.0.0
base:
- template:_images/debian-13
vmType: vz
cpus: 6
memory: 8GiB
disk: 64GiB
mounts:
# The OpenDAP workspace: image definitions, inputs and outputs are shared with the host.
- location: "__WORKSPACE__"
  writable: true
# The toolkit's host-wide data (the development key tree), read-only.
- location: "__DATA__"
  writable: false
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    export DEBIAN_FRONTEND=noninteractive
    grep -q trixie-backports /etc/apt/sources.list.d/*.sources 2>/dev/null || cat > /etc/apt/sources.list.d/backports.sources <<'SRC'
    Types: deb
    URIs: http://deb.debian.org/debian
    Suites: trixie-backports
    Components: main
    Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
    SRC
    apt-get update
    apt-get install -y --no-install-recommends \
      mkosi systemd-container systemd-repart dosfstools e2fsprogs erofs-utils \
      squashfs-tools cpio zstd xz-utils qemu-system-arm qemu-utils ovmf qemu-efi-aarch64 \
      debian-archive-keyring apt git ca-certificates openssh-client
